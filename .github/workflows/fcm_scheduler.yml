name: ClassGuard FCM Scheduler

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install

      - name: Run Scheduler
        run: node scripts/fcm_scheduler.js